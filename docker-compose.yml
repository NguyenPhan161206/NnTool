services:
  ollama:
    build: ./ollama
    container_name: toolhub-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_DEFAULT_MODEL=qwen3:1.7b
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: toolhub-backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=qwen3:1.7b
      - OLLAMA_HOST=http://ollama:11434
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: toolhub-frontend
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
